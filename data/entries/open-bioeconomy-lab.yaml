name: "Open Bioeconomy Lab"
domain: "research / education tech"
what: >-
  Open Bioeconomy Lab is an interdisciplinary research group at the University of Cambridge
  that develops open source biomanufacturing tools and reagents. It works with partners in
  low-resource settings, particularly in the Global South, to make biological research more
  accessible.
